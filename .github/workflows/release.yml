# Build the desktop apps and publish a GitHub Release.
#
# To release: bump "version" in package.json, commit, then
#   git tag v0.2.0 && git push origin v0.2.0
# The installed apps find the new release next time they open.

name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    # One draft release that every platform uploads into
    draft:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Check the tag matches package.json
              run: |
                  VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION"
                    exit 1
                  fi
            - name: Create draft release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
                    gh release create "$GITHUB_REF_NAME" --draft --title "Jewel VTT $GITHUB_REF_NAME" --generate-notes

    build:
        needs: draft
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Build and upload
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm run release

    # Only publish once every platform uploaded, so apps never see half a release
    publish:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
